services:
  - type: web
    name: kiera-gordon-digital
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@11.19.0 && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
